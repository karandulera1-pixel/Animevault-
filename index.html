/* AnimeVault – mobile improvements */
*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  max-width: 100%;
  overflow-x: clip;
  -webkit-text-size-adjust: 100%;
}

body {
  max-width: 100%;
  margin: 0;
  overflow-x: clip;
}

img,
video {
  max-width: 100%;
  height: auto;
  display: block;
}
